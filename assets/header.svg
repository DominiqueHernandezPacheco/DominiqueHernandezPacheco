<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Dominique Hernández, Computer Systems Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="0.5" stop-color="#d9eafc"/>
      <stop offset="1" stop-color="#e8eefc"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="26s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7fd1"/>
      <stop offset="1" stop-color="#8a9df0"/>
    </linearGradient>
    <clipPath id="marco"><rect width="1280" height="300" rx="22"/></clipPath>
    <path id="brillo" d="M0 -12 Q0 0 12 0 Q0 0 0 12 Q0 0 -12 0 Q0 0 0 -12Z"/>
  </defs>
  <style>
    .t { font-family: "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .titulo { font-size: 64px; font-weight: 700; fill: url(#titulo); animation: entra 1.4s ease-out both; }
    .sub { font-size: 27px; fill: #5d6f99; opacity: 0; animation: ciclo 12s infinite; }
    .s2 { animation-delay: 4s; }
    .s3 { animation-delay: 8s; }
    .linea { stroke: #f4b6d2; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 260; stroke-dashoffset: 260; animation: dibuja 1.6s 0.8s ease-out forwards; }
    @keyframes entra { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ciclo { 0% { opacity: 0; } 6% { opacity: 1; } 30% { opacity: 1; } 36% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes dibuja { to { stroke-dashoffset: 0; } }
  </style>
  <g clip-path="url(#marco)">
    <rect width="1280" height="300" fill="url(#bg)"/>
    <path fill="#a9d1f5" opacity="0.55" d="M0 235 Q160 195 320 235 T640 235 T960 235 T1280 235 T1600 235 T1920 235 T2240 235 T2560 235 V300 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-640 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path fill="#c4cffa" opacity="0.6" d="M0 256 Q160 221 320 256 T640 256 T960 256 T1280 256 T1600 256 T1920 256 T2240 256 T2560 256 V300 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-640 0" to="0 0" dur="17s" repeatCount="indefinite"/>
    </path>
    <g fill="#ffffff">
      <use href="#brillo" transform="translate(150 70) scale(1.1)"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" repeatCount="indefinite"/></use>
      <use href="#brillo" transform="translate(300 215) scale(0.7)"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></use>
      <use href="#brillo" transform="translate(1090 60) scale(1.3)"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.6s" begin="0.4s" repeatCount="indefinite"/></use>
      <use href="#brillo" transform="translate(1170 190) scale(0.8)"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.9s" begin="1.2s" repeatCount="indefinite"/></use>
      <use href="#brillo" transform="translate(960 235) scale(0.6)"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></use>
    </g>
    <text class="t titulo" x="640" y="112">Dominique Hernández</text>
    <line class="linea" x1="510" y1="136" x2="770" y2="136"/>
    <text class="t sub" x="640" y="188">Computer Systems Engineer</text>
    <text class="t sub s2" x="640" y="188">Sports data &amp; computer vision</text>
    <text class="t sub s3" x="640" y="188">Injury prevention · Accessibility</text>
  </g>
</svg>
